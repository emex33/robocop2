services:
  drachtio:
    image: drachtio/drachtio-server:latest
    restart: unless-stopped
    network_mode: host
    command: >
      drachtio
      --contact "sip:*:5060;transport=udp"
      --external-ip 45.87.212.182
      --loglevel info
      --secret cymru

  rtpengine:
    image: drachtio/rtpengine:latest
    restart: unless-stopped
    privileged: true
    environment:
      - CLOUD=1
    ports:
      - "60000-60200:60000-60200/udp"
    networks:
      - robocop

  voice-agent:
    build: ./local-voice-agent
    restart: unless-stopped
    environment:
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE=int8
      - TTS_MODEL=tts_models/multilingual/multi-dataset/xtts_v2
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - VOICE_AGENT_PORT=8765
    ports:
      - "8765:8765"
    volumes:
      - voice-agent-models:/root/.local/share
    networks:
      - robocop

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - drachtio
      - rtpengine
    ports:
      - "3000:3000"
      - "20000-20100:20000-20100/udp"
    environment:
      - EXTERNAL_RTP_IP=45.87.212.182
      - RTP_PORT_MIN=20000
      - RTP_PORT_MAX=20100
      - DRACHTIO_HOST=172.18.0.1
      - LOCAL_VOICE_AGENT_URL=ws://voice-agent:8765
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./data2:/app/data
      - ./logs:/app/logs
    networks:
      - robocop

volumes:
  voice-agent-models:

networks:
  robocop:
    driver: bridge
