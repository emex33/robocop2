services:
  drachtio:
    image: drachtio/drachtio-server:latest
    restart: unless-stopped
    network_mode: host
    command: >
      drachtio
      --contact "sip:*:5060;transport=udp"
      --external-ip 84.32.97.51
      --loglevel info
      --secret cymru
    healthcheck:
      # The drachtio image has no `ss`/`netstat`, so the old check always failed
      # and marked the container "unhealthy". Read the listening UDP sockets
      # straight from /proc instead (5060 == hex 13C4).
      test: ["CMD-SHELL", "grep -qi ':13C4 ' /proc/net/udp || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  rtpengine:
    image: drachtio/rtpengine:latest
    restart: unless-stopped
    privileged: true
    environment:
      - CLOUD=1
    ports:
      - "60000-60200:60000-60200/udp"
    networks:
      - robocop

  voice-agent:
    build: ./local-voice-agent
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      # ── STT (faster-whisper) ──
      - WHISPER_MODEL=large-v3-turbo
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE=float16
      - STT_BEAM_SIZE=5
      - STT_BEST_OF=1
      - STT_VAD_MIN_SILENCE_MS=300
      - STT_NO_SPEECH_THRESHOLD=0.6
      - STT_COMPRESSION_RATIO_THRESHOLD=2.4
      - STT_LOG_PROB_THRESHOLD=-0.5
      # ── VAD & Barge-in (Silero neural VAD) ──
      - VAD_THRESHOLD=0.35
      - BARGE_IN_THRESHOLD=0.45
      - BARGE_IN_MIN_FRAMES=5
      - SILENCE_DURATION_MS=700
      - POST_TTS_IGNORE_MS=350
      # ── TTS (XTTS v2 direct inference) ──
      - TTS_MODEL=tts_models/multilingual/multi-dataset/xtts_v2
      - TTS_SPEAKER_WAV=/app/speaker_wavs/cloner_premium.wav
      - TTS_TEMPERATURE=0.85
      - TTS_TOP_P=0.85
      - TTS_TOP_K=50
      - TTS_REPETITION_PENALTY=1.5
      - TTS_LENGTH_PENALTY=1.0
      - TTS_SPEED=1.1
      - TTS_STREAM_CHUNK_MS=20
      - TTS_STREAM_SLEEP_MS=0.015
      # ── LLM ──
      - LLM_BASE_URL=${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - LLM_API_KEY=${LLM_API_KEY:-${GEMINI_API_KEY:-}}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-pro}
      - LLM_MAX_TOKENS=180
      - LLM_TEMPERATURE=0.2
      - MAX_HISTORY_MESSAGES=16
      # ── Response shaping ──
      - MAX_RESPONSE_SENTENCES=3
      - MAX_RESPONSE_CHARS=280
      # ── GPU concurrency (20-call target) ──
      - GPU_STT_CONCURRENCY=3
      - GPU_TTS_CONCURRENCY=2
      # ── WebSocket ──
      - WS_PING_INTERVAL=20
      - WS_PING_TIMEOUT=60
      - VOICE_AGENT_PORT=8765
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "8765:8765"
    volumes:
      - voice-agent-models:/root/.local/share
      - ./local-voice-agent/speaker_wavs:/app/speaker_wavs
    networks:
      - robocop

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - drachtio
      - rtpengine
    ports:
      - "3000:3000"
      - "20000-20200:20000-20200/udp"
    environment:
      - EXTERNAL_RTP_IP=84.32.97.51
      - RTP_PORT_MIN=20000
      - RTP_PORT_MAX=20200
      - DRACHTIO_HOST=172.18.0.1
      - LOCAL_VOICE_AGENT_URL=ws://voice-agent:8765
      # SQLite lives on a Docker volume (Linux ext4 inside the Docker VM), NOT
      # on the ./data bind mount. ./data is a OneDrive-synced Windows folder;
      # the same queries measured 30x slower there and every slow query froze
      # the dialer. A nightly copy is written back to ./data/backups.
      - DB_PATH=/app/dbdata/robocop.db
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - robocop-db:/app/dbdata
    networks:
      - robocop

  app2:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - drachtio
      - rtpengine
    ports:
      - "3001:3001"
      - "20201-20400:20201-20400/udp"
    environment:
      - DASHBOARD_PORT=3001
      - EXTERNAL_RTP_IP=84.32.97.51
      - RTP_PORT_MIN=20201
      - RTP_PORT_MAX=20400
      - DRACHTIO_HOST=172.18.0.1
      - LOCAL_VOICE_AGENT_URL=ws://voice-agent:8765
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./data2:/app/data
      - ./logs2:/app/logs
    networks:
      - robocop

volumes:
  voice-agent-models:
  robocop-db:

networks:
  robocop:
    driver: bridge
